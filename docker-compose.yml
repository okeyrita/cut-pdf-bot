# Five services: the bot, a Celery worker, RabbitMQ (broker), Redis (FSM + results + event stream)
# and a self-hosted Telegram Bot API server.
#
# Two volumes matter and are easy to get wrong:
#   pdf-data     shared by bot and worker. Files never cross the broker; only paths do.
#   bot-api-data shared by bot and telegram-bot-api. In --local mode getFile returns a filesystem
#                path rather than a URL, so the bot must be able to read the API server's storage.

name: pdfbot

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: pdfbot:latest
  env_file: [.env]
  environment:
    DATA_DIR: /data
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  volumes:
    - pdf-data:/data
  restart: unless-stopped
  depends_on:
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

services:
  bot:
    <<: *app
    command: ["python", "-m", "pdfbot"]
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      USE_LOCAL_BOT_API: ${USE_LOCAL_BOT_API:-true}
      LOCAL_BOT_API_URL: http://telegram-bot-api:8081
      LOCAL_BOT_API_DATA_DIR: /var/lib/telegram-bot-api
    volumes:
      - pdf-data:/data
      # Read-only: the API server owns these files and cleans them up itself.
      - bot-api-data:/var/lib/telegram-bot-api:ro
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      telegram-bot-api: {condition: service_started}

  worker:
    <<: *app
    # --max-tasks-per-child recycles the process periodically: Ghostscript and tesseract are
    # subprocess-heavy and long-lived workers accumulate memory.
    command:
      - celery
      - --app=pdfbot.worker.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=20
    healthcheck:
      test: ["CMD-SHELL", "celery --app=pdfbot.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      # From https://my.telegram.org/apps -- these identify the *server*, not your bot.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: 1
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:15672:15672"  # management UI, loopback only
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Persistence matters here: Redis holds FSM state and the undelivered event stream, so a
    # restart without it strands every in-flight conversation.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pdf-data:
  bot-api-data:
  rabbitmq-data:
  redis-data:
