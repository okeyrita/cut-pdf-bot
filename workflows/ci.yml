name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    name: lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: mypy
        run: uv run mypy

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Ghostscript is needed for the lossy-compression tests; without it they skip rather than
      # fail, but we want them actually running in CI.
      - name: install ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: uv sync --locked
      - run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # testcontainers starts RabbitMQ and Redis itself; the runner's Docker daemon is enough.
      - run: uv run pytest -m integration

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pdfbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: verify the OCR toolchain is present in the image
        run: |
          docker run --rm pdfbot:ci tesseract --list-langs
          docker run --rm pdfbot:ci gs --version
          docker run --rm pdfbot:ci python -c "import pdfbot; print(pdfbot.__version__)"
