default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      # This repository previously shipped a live bot token in source. Never again.
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # mypy needs the real dependencies to check anything useful, so the hook installs them
        # rather than running against a bare environment.
        additional_dependencies:
          - aiogram>=3.31
          - pydantic>=2.13
          - pydantic-settings>=2.15
          - pypdf>=6.16
          - pikepdf>=10.12
          - redis>=6.4
          - pytest>=9.1
          - types-reportlab
        args: [--config-file=pyproject.toml]
        pass_filenames: false
